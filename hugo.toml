baseURL = "https://allanware.github.io/"
theme = "hugo-bearneo"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = false
capitalizeListTitles = false

[taxonomies]
  tag = "tags"

[permalinks.page]
  blog = "/p/:contentbasename/"
  projects = "/p/:contentbasename/"

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[services.rss]
  limit = 10

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# Class-based highlighting so assets/css/syntax.css can follow the reader's
# color scheme; inline Chroma colors cannot.
[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  groupByYear = true
  showPostCount = true
  postSearch = true
  toc = true
  imageZoom = true
  externalLinksNewTab = false
  contactEmail = "xiaodoubizwx@gmail.com"
  githubURL = "https://github.com/Allanware"
  scholarURL = "https://scholar.google.com/citations?user=cd-oBQUAAAAJ"

[params.giscus]
  enabled = true
  repo = "Allanware/Allanware.github.io"
  repoId = "R_kgDOTzd2Dw"
  category = "Announcements"
  categoryId = "DIC_kwDOTzd2D84DDBer"

[params.kudos]
  enabled = true
  endpoint = "https://allanware-kudos.xiaodoubizwx.workers.dev"

# Keep the vendored RSS template on its supported params.author path.
[params.author]
  name = ""
  email = ""

[languages.en]
  direction = "ltr"
  label = "English"
  locale = "en-US"
  title = "┐(￣▽￣)ゞ Where Was I"
  weight = 1

  [languages.en.params]
    description = "Posts by Wenxuan Zhao"
    giscusLanguage = "en"
    dateFormat = ":date_long"
    listDateFormat = "January 2"

  [[languages.en.menus.main]]
    identifier = "home"
    name = "Home"
    pageRef = "/"
    weight = 10

  [[languages.en.menus.main]]
    identifier = "posts"
    name = "Blog"
    pageRef = "/blog"
    weight = 20

  [[languages.en.menus.main]]
    identifier = "tags"
    name = "Tags"
    pageRef = "/tags"
    weight = 30

[languages.zh]
  direction = "ltr"
  hasCJKLanguage = true
  label = "中文"
  locale = "zh-CN"
  title = "┐(￣▽￣)ゞ 说哪儿了"
  weight = 2

  [languages.zh.params]
    description = "赵文轩的文章"
    giscusLanguage = "zh-CN"
    dateFormat = ":date_long"
    listDateFormat = "1月2日"

  [[languages.zh.menus.main]]
    identifier = "home"
    name = "首页"
    pageRef = "/"
    weight = 10

  [[languages.zh.menus.main]]
    identifier = "posts"
    name = "博客"
    pageRef = "/blog"
    weight = 20

  [[languages.zh.menus.main]]
    identifier = "tags"
    name = "标签"
    pageRef = "/tags"
    weight = 30
